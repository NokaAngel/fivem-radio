<html>
<head>
    <script>
        const audioContext = new AudioContext({
            latencyHint: 'playback'
        });
        const vehiclesRadio = {};
        let stations = [];
        let volume = 1;
        let customRadios;

        /**
         * Radio class containing the state of our stations.
         * Includes all methods for playing, stopping, etc.
         * @param {number} index - Current station index.
         * @param {boolean} isInside - If the player is inside.
         * @param {boolean} isLoud - If the station is loud.
         * @param {Array} position - Array of position [x, y z].
         */
        const Radio = function (index = 0, isInside = true, isLoud = false, position = [0, 0, 0]) {
            this.index = index;
            this.isInside = isInside;
            this.isLoud = isLoud;
            this.position = position;
            this.retryDelay = 1000;
            this.retryTimer = null;
            this.stableTimer = null;
            this.sourceToken = 0;
            this.isStopped = false;

            this.panner = audioContext.createPanner();
            this.panner.panningModel = 'HRTF';
            this.panner.refDistance = 1.2;
            this.panner.rolloffFactor = 1.0;
            this.panner.distanceModel = 'exponential';
            this.panner.setPosition(...position);
        };
        Radio.prototype = {
            /**
             * Start a station's live stream.
             */
            play: function () {
                const self = this;
                const station = stations[this.index];

                if (!station || !station.data || !station.data.url) {
                    console.error(`[FiveM Radio] Station ${this.index} has no playable URL.`);
                    return;
                }

                self.isStopped = false;
                const sourceToken = ++self.sourceToken;

                // Setup a new audio element if needed.
                if (!self.sound) {
                    self.sound = new Audio();

                    const mediaElementSource = audioContext.createMediaElementSource(self.sound);
                    mediaElementSource.connect(self.panner);
                    self.panner.connect(audioContext.destination);
                }

                // Streams can end or fail transiently; reconnect using the current source token only.
                self.sound.onended = () => self.scheduleReconnect(sourceToken, 'stream ended');
                self.sound.onerror = () => self.scheduleReconnect(sourceToken, 'media error');

                // Set media source.
                self.sound.src = station.data.url;
                self.sound.load();

                // Set inital position and volume.
                self.setPosition(self.isInside, self.isLoud, self.position);

                // Begin playing the sound.
                audioContext.resume().catch((err) => console.warn('[FiveM Radio] Audio context resume failed:', err));
                self.sound.play().then(() => {
                    if (sourceToken === self.sourceToken) {
                        if (self.stableTimer) clearTimeout(self.stableTimer);
                        self.stableTimer = setTimeout(() => {
                            if (sourceToken === self.sourceToken) self.retryDelay = 1000;
                            self.stableTimer = null;
                        }, 60000);
                    }
                }).catch((err) => self.scheduleReconnect(sourceToken, err.message || 'playback failed'));
            },

            /** Retry a failed or ended stream with capped exponential backoff. */
            scheduleReconnect: function (sourceToken, reason) {
                if (this.isStopped || sourceToken !== this.sourceToken || this.retryTimer) {
                    return;
                }

                if (this.stableTimer) {
                    clearTimeout(this.stableTimer);
                    this.stableTimer = null;
                }

                const delay = this.retryDelay;
                this.retryDelay = Math.min(this.retryDelay * 2, 30000);
                console.warn(`[FiveM Radio] ${reason}; retrying in ${delay}ms.`);
                this.retryTimer = setTimeout(() => {
                    this.retryTimer = null;
                    if (!this.isStopped && sourceToken === this.sourceToken) this.play();
                }, delay);
            },

            /**
             * Stop a station's live stream.
             */
            stop: function () {
                this.isStopped = true;
                this.sourceToken++;
                if (this.retryTimer) {
                    clearTimeout(this.retryTimer);
                    this.retryTimer = null;
                }
                if (this.stableTimer) {
                    clearTimeout(this.stableTimer);
                    this.stableTimer = null;
                }

                if (this.sound) {
                    this.sound.onended = null;
                    this.sound.onerror = null;
                    this.sound.pause();
                    this.sound.removeAttribute('src');
                    this.sound.load();
                }
            },

            /**
             * Change stations volume.
             */
            setVolume: function() {
                if (this.sound) {
                    const stationVolume = Number.isFinite(stations[this.index].data.volume)
                        ? stations[this.index].data.volume
                        : 1.0;
                    const profileVolume = Number.isFinite(volume) ? volume : 1.0;
                    this.sound.volume = Math.max(0, Math.min(1,
                        (stationVolume * profileVolume) / (this.isInside || this.isLoud ? 1 : 2)
                    ));
                }
            },

            /**
             * Play a station with a specific index.
             * @param  {Number} index - Current station index.
             */
            setIndex: function(index) {
                this.stop();
                this.index = index;
                this.retryDelay = 1000;
                this.play();
            },

            /**
             * Change stations position.
             * @param {boolean} isInside - If the player is inside.
             * @param {boolean} isLoud - If the station is loud.
             * @param {Array} position - Array of position [x, y z].
             */
            setPosition: function(isInside, isLoud, position) {
                this.isInside = isInside;
                this.isLoud = isLoud;
                this.position = position;

                if (this.sound) {
                    if (isInside) {
                        this.panner.setPosition(0, 0, 0);
                    } else {
                        this.panner.setPosition(...position);
                    }
                    this.setVolume();
                }
            },
        };

        const resourceName = GetParentResourceName();

        // NUI may load before the client callback is ready, so retry initialization instead of staying silent.
        async function initialize(retryCount = 0) {
            try {
                const response = await fetch(`https://${resourceName}/ready`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}'
                });
                if (!response.ok) throw new Error(`ready callback returned HTTP ${response.status}`);

                const data = await response.json();
                if (!Array.isArray(data.radios)) throw new Error('ready callback returned an invalid radio list');

                stations = data.radios;
                volume = Number.isFinite(data.volume) ? data.volume : 1.0;

                window.addEventListener('message', (event) => {
                let item = event.data;

                switch (item.type) {
                    case 'vehicles':
                        const radios = item.data;

                        for (const vehicle in radios) {
                            const radio = radios[vehicle];

                            if (!vehiclesRadio[vehicle]) {
                                vehiclesRadio[vehicle] = new Radio(radio.radioIndex, radio.isInside, radio.isLoud, radio.position);
                                vehiclesRadio[vehicle].play();
                            } else {
                                vehiclesRadio[vehicle].setPosition(radio.isInside, radio.isLoud, radio.position);

                                if (vehiclesRadio[vehicle].index !== radio.radioIndex) {
                                    vehiclesRadio[vehicle].setIndex(radio.radioIndex);
                                }
                            }
                        }

                        break;
                    case 'volume':
                        volume = item.volume;

                        for (const vehicle in vehiclesRadio) {
                            vehiclesRadio[vehicle].setVolume();
                        }

                        break;
                    case 'stop':
                        const vehicle = item.vehicle;

                        if (vehiclesRadio[vehicle]) {
                            vehiclesRadio[vehicle].stop();
                            delete vehiclesRadio[vehicle];
                        }

                        break;
                }
                });
            } catch (error) {
                const delay = Math.min(1000 * (2 ** retryCount), 15000);
                console.error(`[FiveM Radio] NUI initialization failed: ${error.message}`);
                console.warn(`[FiveM Radio] Retrying NUI initialization in ${delay}ms.`);
                setTimeout(() => initialize(retryCount + 1), delay);
            }
        }

        initialize();
    </script>
</head>
<body>
</body>
</html>
